<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PetStay Check-In</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/checkin.css">
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
</head>

<body class="bg-light">
  <div class="container mt-5 text-center">
    <h2 class="mb-4">🐾 PetStay Check-In</h2>
    <div id="result" class="alert alert-info">Loading booking details...</div>
    <div id="roomInfo" class="mt-3 fw-bold text-primary"></div>
  </div>

  <!-- Toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="checkinToast" class="toast text-white bg-success border-0" role="alert" aria-live="polite"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="checkinToastMsg">Check-in successful!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script>
    const allowedStaffEmails = ["petstayteam@gmail.com"];
    let currentEmail = null;
    let bookingId = null;

    document.addEventListener("DOMContentLoaded", async function () {
      // Extract the bookingId from the URL query parameters
      const urlParams = new URLSearchParams(window.location.search);
      bookingId = urlParams.get('bookingId');

      if (!bookingId) {
        document.getElementById("result").innerHTML = "<span class='text-danger'>Booking ID is missing in the URL.</span>";
        return;
      }

      await fetchBookingDetails(bookingId);

      // Auto-check-in if redirected after login
      if (urlParams.get('fromLogin') === "1") {
        checkInAfterLogin();

        // Remove fromLogin=1 from the URL for a clean bookmark/share experience
        urlParams.delete('fromLogin');
        window.history.replaceState({}, document.title, window.location.pathname + '?' + urlParams.toString());
      }
    });

    // Function to fetch booking details and render the info
    async function fetchBookingDetails(bookingId) {
      try {
        const response = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}`);
        const booking = await response.json();

        if (response.ok && booking.BookingID) {
          renderBookingInfo(booking);
        } else {
          document.getElementById("result").innerHTML = "<span class='text-danger'>No booking found.</span>";
        }
      } catch (err) {
        document.getElementById("result").innerHTML = "<span class='text-danger'>Failed to load booking info.</span>";
      }
    }

    // Function to render booking details and handle the check-in button
    function renderBookingInfo(booking) {
      let checkInButtonHTML = "";

      if (booking.Status === 'Confirmed') {
        checkInButtonHTML = `<button id="checkinButton" class="btn btn-success mt-3" onclick="loginThenCheckIn()">Mark as Checked-In</button>`;
      } else if (booking.Status === 'Checked-In') {
        checkInButtonHTML = `<div class="text-success fw-bold">Already checked in.</div>`;
      } else if (booking.Status === 'Checked-Out') {
        checkInButtonHTML = `<div class="text-secondary fw-bold">🐾 Thank you for choosing PetStay!</div>`;
      } else {
        checkInButtonHTML = `<div class="text-warning fw-bold">Awaiting admin confirmation before check-in.</div>`;
      }

      document.getElementById("result").innerHTML = `
        <h5 class="text-success">Booking Found</h5>
        <p><strong>Owner:</strong> ${booking.OwnerName}</p>
        <p><strong>Pet:</strong> ${booking.PetName} (${booking.PetSpecies})</p>
        <p><strong>Status:</strong> 
          <span class="badge bg-${booking.Status === 'Checked-In' ? 'success' : booking.Status === 'Confirmed' ? 'primary' : booking.Status === 'Checked-Out' ? 'secondary' : 'warning'}">${booking.Status}</span>
        </p>
        ${checkInButtonHTML}
      `;
    }

    // Redirect user to the Cognito login page to authenticate and then check in
    function loginThenCheckIn() {
      sessionStorage.setItem("redirectAfterLogin", window.location.href);
      const loginURL = "https://us-east-1i0pziizgm.auth.us-east-1.amazoncognito.com/login?client_id=4jfnrkopa8cb7r30i0i25gar8k&response_type=code&scope=email+openid+phone&redirect_uri=https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/post-login.html";
      window.location.href = loginURL;
    }

    // Function that is triggered after user login to perform the check-in
    async function checkInAfterLogin() {
      try {
        // Retrieve the current authenticated user
        const user = await Amplify.Auth.currentAuthenticatedUser();
        currentEmail = user?.attributes?.email;

        // Check if the user is authorized to perform check-in
        if (!allowedStaffEmails.includes(currentEmail)) {
          alert("You are not authorized to perform check-in.");
          return;
        }

        // Get the authentication token
        const session = await Amplify.Auth.currentSession();
        const token = session.getIdToken().getJwtToken();

        // Send check-in request to the backend
        const res = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}/checkin`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        // Handle successful check-in
        if (res.ok) {
          const result = await res.json();

          // Update UI with room information and disable the button
          document.getElementById("roomInfo").innerText = `Assigned Room: ${result.roomId}`;
          const checkInButton = document.getElementById("checkinButton");
          if (checkInButton) {
            checkInButton.disabled = true;
            checkInButton.innerText = "Checked In";
          }

          // Update the status badge to 'Checked-In'
          const statusElement = document.querySelector("span.badge");
          if (statusElement) {
            statusElement.textContent = "Checked-In";
            statusElement.classList.remove("bg-primary");
            statusElement.classList.add("bg-success");
          }

          // Show success toast notification
          const toastMsg = document.getElementById("checkinToastMsg");
          toastMsg.textContent = `✅ Check-in successful. Room Assigned: ${result.roomId}`;
          const toast = new bootstrap.Toast(document.getElementById("checkinToast"));
          toast.show();

          // Call to refresh booking status and update UI after check-in
          refreshBookingStatus();
        } else {
          // Handle failed check-in
          alert("Check-in failed.");

          // Fetch and render updated booking info after failure
          const updatedRes = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}`);
          const updatedBooking = await updatedRes.json();
          renderBookingInfo(updatedBooking); // Update the booking info UI

          // If the status has changed to "Checked-In", disable the check-in button
          if (updatedBooking.Status === 'Checked-In') {
            const checkInButton = document.querySelector("button[onclick='loginThenCheckIn()']");
            if (checkInButton) {
              checkInButton.disabled = true;
              checkInButton.textContent = "Already Checked-In";
            }
          }
        }
      } catch (err) {
        console.error("Error during check-in after login:", err);
        alert("Session expired or unauthorized.");
      }
    }

    // Call this function after the booking details are loaded to ensure up-to-date status
    async function refreshBookingStatus() {
      try {
        const response = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}`);
        const updatedBooking = await response.json();
        renderBookingInfo(updatedBooking);
      } catch (err) {
        console.error("Error fetching updated booking status:", err);
      }
    }
  </script>
</body>

</html>
