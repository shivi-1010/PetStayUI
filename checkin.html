<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PetStay Check-In</title>
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/checkin.css">
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>

  <script src="assets/js/auth-check.js"></script>
</head>

<body class="bg-light">
  <div class="container mt-5 text-center">
    <h2 class="mb-4">🐾 PetStay Check-In</h2>
    <div id="result" class="alert alert-info">Loading booking details...</div>
    <div id="roomInfo" class="mt-3 fw-bold text-primary"></div>
  </div>

  <script>
    sessionStorage.setItem("redirectAfterLogin", window.location.href);

    document.addEventListener("DOMContentLoaded", async function () {
      const params = new URLSearchParams(window.location.search);
      const bookingId = params.get("bookingId");

      if (!bookingId) {
        document.getElementById("result").innerHTML = "<span class='text-danger'>Booking ID not found in QR.</span>";
        return;
      }

      let isAdmin = false;
      let currentEmail = null;

      try {
        const user = await window.Amplify.Auth.currentAuthenticatedUser();
        currentEmail = user?.attributes?.email;
        isAdmin = !!currentEmail;
      } catch (err) {
        isAdmin = false;
      }

      try {
        const response = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}`);
        const booking = await response.json();

        if (response.ok && booking.BookingID) {
          let checkInButtonHTML = "";

          if (booking.Status === 'Confirmed') {
            checkInButtonHTML = isAdmin
              ? `<button class="btn btn-success mt-3" onclick="checkIn('${booking.BookingID}')">Mark as Checked-In</button>`
              : `<div class="text-warning fw-bold">Please present this code at reception for staff check-in.</div>`;
          } else if (booking.Status === 'Checked-In') {
            checkInButtonHTML = `<div class="text-success fw-bold">Already checked in.</div>`;
          } else if (booking.Status === 'Checked-Out') {
            checkInButtonHTML = `<div class="text-secondary fw-bold">🐾 Thank you for choosing PetStay! We hope to see you and your furry friend again soon.</div>`;
          } else {
            checkInButtonHTML = `<div class="text-warning fw-bold">Awaiting admin confirmation before check-in.</div>`;
          }

          document.getElementById("result").innerHTML = `
        <h5 class="text-success">Booking Found</h5>
        <p><strong>Owner:</strong> ${booking.OwnerName}</p>
        <p><strong>Pet:</strong> ${booking.PetName} (${booking.PetSpecies})</p>
        <p><strong>Check-In Date:</strong> ${booking.CheckInDate}</p>
        <p><strong>Status:</strong> 
          <span class="badge bg-${booking.Status === 'Checked-In' ? 'success' : booking.Status === 'Confirmed' ? 'primary' : booking.Status === 'Checked-Out' ? 'secondary' : 'warning'}">${booking.Status}</span>
        </p>
        ${checkInButtonHTML}
      `;
        } else {
          document.getElementById("result").innerHTML = "<span class='text-danger'>No booking found.</span>";
        }
      } catch (err) {
        document.getElementById("result").innerHTML = "<span class='text-danger'>Failed to load booking info.</span>";
      }
    });


    async function checkIn(bookingId) {
      const res = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}/checkin`, {
        method: "POST"
      });

      if (res.ok) {
        const result = await res.json();
        const toastMsg = document.getElementById("checkinToastMsg");
        toastMsg.textContent = `✅ Check-in successful. Room Assigned: ${result.roomId}`;
        const toast = new bootstrap.Toast(document.getElementById("checkinToast"));
        toast.show();

        const checkInBtn = document.querySelector("button.btn-success");
        if (checkInBtn) checkInBtn.disabled = true;
        document.getElementById("roomInfo").innerText = "Processing check-in... ⏳";

        setTimeout(() => {
          document.getElementById("roomInfo").innerText = `Assigned Room: ${result.roomId}`;
        }, 1000);

        await updateBookingDisplay(bookingId);
      } else {
        const error = await res.json();
        alert(`Failed to check in: ${error.message || 'Unknown error'}`);
      }
    }

    async function updateBookingDisplay(bookingId) {
      try {
        const response = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}`);
        const booking = await response.json();

        if (response.ok && booking.BookingID) {
          // You can repeat similar admin logic here if needed for updates.
          document.getElementById("result").innerHTML = `
            <h5 class="text-success">Booking Updated</h5>
            <p><strong>Owner:</strong> ${booking.OwnerName}</p>
            <p><strong>Pet:</strong> ${booking.PetName} (${booking.PetSpecies})</p>
            <p><strong>Check-In Date:</strong> ${booking.CheckInDate}</p>
            <p><strong>Status:</strong> 
              <span class="badge bg-success">Checked-In</span>
            </p>
            <div class="text-success fw-bold">Already checked in.</div>
          `;
        }
      } catch (err) {
        console.error("Failed to refresh booking display", err);
      }
    }
  </script>

  <!-- ✅ Toast container -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="checkinToast" class="toast text-white bg-success border-0" role="alert" aria-live="polite"
      aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="checkinToastMsg">Check-in successful!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

</body>

</html>
