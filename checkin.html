<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PetStay Check-In</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/assets/css/checkin.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="bg-light">
  <div class="container mt-5 text-center">
    <h2 class="mb-4">🐾 PetStay Check-In</h2>
    <div id="result" class="alert alert-info">Loading booking details...</div>
    <div id="roomInfo" class="mt-3 fw-bold text-primary"></div>
  </div>

  <!-- success toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="checkinToast" class="toast text-white bg-success border-0" role="alert" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="checkinToastMsg">Check-in successful!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script>
    const allowedStaffEmails = window.PETSTAY_CONFIG.ALLOWED_STAFF_EMAILS || [
      "petstayteam@outlook.com", "petstayteam@gmail.com"
    ];
    let bookingId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const { default: Amplify } = window.aws_amplify || {};
      const urlParams = new URLSearchParams(location.search);

      bookingId = urlParams.get("bookingId") || sessionStorage.getItem("bookingId");
      const fromLogin = urlParams.get("fromLogin") || sessionStorage.getItem("fromLogin");

      // If someone hits checkin.html with ?code=..., immediately bounce to the handler to finish OAuth
      if (urlParams.has("code")) {
        const base = window.PETSTAY_CONFIG.REDIRECT_SIGN_IN_URL; // /admin-frontend/post-login.html
        const handler = `${base}${base.includes("?") ? "&" : "?"}bookingId=${encodeURIComponent(bookingId || "")}&fromLogin=1`;
        location.replace(handler);
        return;
      }

      // clean URL noise (optional)
      if (bookingId) history.replaceState({}, document.title, `${location.pathname}?bookingId=${bookingId}`);

      if (!bookingId) {
        document.getElementById("result").innerHTML =
          "<span class='text-danger'>Invalid QR Code. Booking ID is missing.</span><p class='mt-2'>Please scan again or open the link in a browser.</p>";
        return;
      }

      // Amplify config (not used for login here, but harmless if present)
      if (Amplify && Amplify.configure) {
        Amplify.configure({
          Auth: {
            region: window.PETSTAY_CONFIG.AWS_REGION,
            userPoolId: window.PETSTAY_CONFIG.COGNITO_USER_POOL_ID,
            userPoolWebClientId: window.PETSTAY_CONFIG.COGNITO_USER_POOL_CLIENT_ID,
            oauth: {
              domain: window.PETSTAY_CONFIG.COGNITO_DOMAIN,
              scope: ["email", "openid", "phone"],
              redirectSignIn: window.PETSTAY_CONFIG.REDIRECT_SIGN_IN_URL,
              redirectSignOut: window.PETSTAY_CONFIG.REDIRECT_SIGN_OUT_URL,
              responseType: "code"
            }
          }
        });
      }

      await fetchBookingDetails(bookingId);

      if (fromLogin === "1") {
        await checkInAfterLogin();
      }
    });

    async function fetchBookingDetails(id) {
      try {
        const r = await fetch(`${window.PETSTAY_CONFIG.BOOKING_API_URL}/${id}?t=${Date.now()}`);
        const booking = await r.json();
        if (r.ok && booking.BookingID) renderBookingInfo(booking);
        else document.getElementById("result").innerHTML = "<span class='text-danger'>No booking found.</span>";
      } catch {
        document.getElementById("result").innerHTML = "<span class='text-danger'>Failed to load booking info.</span>";
      }
    }

    function renderBookingInfo(b) {
      let btnHTML = "";
      if (b.Status === "Confirmed") {
        btnHTML = `
          <p class="text-muted">A PetStay staff member must complete check-in.<br/>Please show this page at the front desk.</p>
          <button id="checkinButton" class="btn btn-primary mt-2" onclick="loginThenCheckIn()">Staff: Continue to Check-In</button>`;
      } else if (b.Status === "Checked-In") {
        btnHTML = `<div class="text-success fw-bold">Already checked in.</div>`;
        if (b.RoomNumber) document.getElementById("roomInfo").innerText = `Room Assigned: ${b.RoomNumber}`;
      } else if (b.Status === "Checked-Out") {
        btnHTML = `<div class="text-secondary fw-bold">🐾 Thank you for choosing PetStay!</div>`;
      } else {
        btnHTML = `<div class="text-warning fw-bold">Awaiting admin confirmation before check-in.</div>`;
      }

      document.getElementById("result").innerHTML = `
        <h5 class="text-success">Booking Found</h5>
        <p><strong>Owner:</strong> ${b.OwnerName}</p>
        <p><strong>Pet:</strong> ${b.PetName} (${b.PetSpecies})</p>
        <p><strong>Status:</strong>
          <span class="badge bg-${
            b.Status === "Checked-In" ? "success" :
            b.Status === "Confirmed" ? "primary" :
            b.Status === "Checked-Out" ? "secondary" : "warning"
          }">${b.Status}</span>
        </p>
        ${btnHTML}`;
    }

    // Always send users to the handler page configured in PETSTAY_CONFIG
    function loginThenCheckIn() {
      const id = new URLSearchParams(location.search).get("bookingId");
      if (!id) { alert("Booking ID missing from URL. Cannot proceed to login."); return; }

      sessionStorage.setItem("bookingId", id);
      sessionStorage.setItem("fromLogin", "1");

      const base = window.PETSTAY_CONFIG.REDIRECT_SIGN_IN_URL; // /admin-frontend/post-login.html
      const redirectUri = `${base}${base.includes("?") ? "&" : "?"}bookingId=${encodeURIComponent(id)}&fromLogin=1`;

      const loginURL = `https://${window.PETSTAY_CONFIG.COGNITO_DOMAIN}/login`
        + `?client_id=${window.PETSTAY_CONFIG.COGNITO_USER_POOL_CLIENT_ID}`
        + `&response_type=code&scope=email+openid+phone`
        + `&redirect_uri=${encodeURIComponent(redirectUri)}`;

      location.href = loginURL;
    }

    async function checkInAfterLogin() {
      try {
        const { Auth } = window.aws_amplify;
        // user now has tokens because post-login.html completed the exchange
        const user = await Auth.currentAuthenticatedUser({ bypassCache: true });

        let session;
        for (let i = 0; i < 5; i++) {
          try { session = await Auth.currentSession(); break; }
          catch { await new Promise(r => setTimeout(r, 800)); }
        }
        if (!session) return alert("Could not initialize session. Try again.");

        const email = (session.getIdToken().payload.email || "").toLowerCase();
        if (!allowedStaffEmails.map(e => e.toLowerCase()).includes(email)) {
          alert(`You are not authorized to perform check-in.\nYour email: ${email}`);
          sessionStorage.removeItem("fromLogin");
          return;
        }

        const id = sessionStorage.getItem("bookingId") || new URLSearchParams(location.search).get("bookingId");
        if (!id) return alert("Booking ID missing. Cannot perform check-in.");

        const res = await fetch(`${window.PETSTAY_CONFIG.CHECKIN_BOOKING_URL}`, {
          method: "POST",
          headers: {
            Authorization: `Bearer ${session.getIdToken().getJwtToken()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ bookingId: id })
        });
        const result = await res.json();

        if (res.ok && (result.message?.includes("Checked-In") || result.newStatus === "Checked-In")) {
          await fetchBookingDetails(id);
          document.getElementById("roomInfo").innerText = `Assigned Room: ${result.roomId || "—"}`;
          const btn = document.getElementById("checkinButton");
          if (btn) { btn.disabled = true; btn.innerText = "Checked In"; }
          const badge = document.querySelector("span.badge");
          if (badge) { badge.textContent = "Checked-In"; badge.classList.remove("bg-primary"); badge.classList.add("bg-success"); }
          setTimeout(() => {
            history.replaceState({}, document.title, `${location.pathname}?bookingId=${id}`);
            new bootstrap.Toast(document.getElementById("checkinToast")).show();
            sessionStorage.removeItem("fromLogin");
            sessionStorage.removeItem("bookingId");
          }, 800);
        } else {
          const errorMsg = result.message || "Unknown error";
          Toastify({ text: "🐾 Check-in failed: " + errorMsg, duration: 4000, gravity: "top", position: "center", backgroundColor: "#ef4444" }).showToast();
          await fetchBookingDetails(id);
        }
      } catch (err) {
        console.error("Check-in error:", err);
        Toastify({ text: "Session expired or check-in failed. Please try again.", duration: 4000, gravity: "top", position: "center", backgroundColor: "#f97316" }).showToast();
      }
    }

    window.loginThenCheckIn = loginThenCheckIn;
  </script>
</body>
</html>
