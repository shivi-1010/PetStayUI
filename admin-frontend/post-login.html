<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>

<body>
  <h2>🔐 Logging you in... Please wait.</h2>

  <script>
    window.addEventListener('load', async () => {
      // const Amplify = window.aws_amplify?.default;
      // const Auth = window.aws_amplify?.Auth;
      const { Amplify, Auth } = window.aws_amplify;
      if (!Amplify || !Auth) {
        console.error("Amplify not available.");
        document.body.innerHTML = "<p style='color:red'>❌ Error loading AWS Amplify.</p>";
        return;
      }

      // 🔧 Configure Amplify
      Amplify.configure({
        Auth: {
          region: 'us-east-1',
          userPoolId: 'us-east-1_I0PzIIZGM',
          userPoolWebClientId: '4jfnrkopa8cb7r30i0i25gar8k',
          oauth: {
            domain: 'us-east-1i0pziizgm.auth.us-east-1.amazoncognito.com',
            scope: ['email', 'openid', 'phone'],
            redirectSignIn: 'https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/post-login.html',
            redirectSignOut: 'https://master.d3lmxb04veurt7.amplifyapp.com/index.html',
            responseType: 'code'
          }
        }
      });

      try {
        console.log("🔐 Handling OAuth redirect...");

        const user = await Auth.currentAuthenticatedUser({ bypassCache: true });
        let session;
        for (let i = 0; i < 5; i++) {
          try {
           session = await Auth.currentSession();
            break;
          } catch (err) {
            console.warn(`⏳ Waiting for Cognito session (attempt ${i + 1})...`);
            await new Promise((r) => setTimeout(r, 1000));
          }
        }
        if (!session) {
          alert("❌ Session could not be established. Please refresh and try again.");
          return;
        }

        const idToken = session.getIdToken();
        const token = idToken.getJwtToken();
        const email = idToken.payload.email || idToken.payload["cognito:username"] || "unknown";
        const normalizedEmail = email.trim().toLowerCase();

        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get("bookingId");
        const fromLogin = urlParams.get("fromLogin") || sessionStorage.getItem("fromLogin");
        sessionStorage.removeItem("fromLogin");

        const allowedStaff = ["petstayteam@outlook.com"];

        // 🔐 Unauthorized redirect
        if (!allowedStaff.includes(normalizedEmail)) {
          alert(`❌ You (${email}) are not authorized to check in guests.`);
          if (bookingId) {
            window.location.href = `https://master.d3lmxb04veurt7.amplifyapp.com/checkin.html?bookingId=${bookingId}&status=unauthorized`;
          } else {
            window.location.href = `https://master.d3lmxb04veurt7.amplifyapp.com/index.html`;
          }
          return;
        }

        // ✅ Check-in flow
        if (bookingId && fromLogin === "1") {
          console.log("🛎️ Detected QR login for booking:", bookingId);

          const res = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}/checkin`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });

          const result = await res.json();

          if (res.ok) {
            console.log("✅ Check-in successful:", result);
            window.location.href = `https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/admin_dashboard.html?refresh=1`;
          } else {
            console.error("❌ Check-in failed:", result.message);
            alert("❌ Check-in failed: " + (result.message || result.error || "Unexpected error"));

            window.location.href = `https://master.d3lmxb04veurt7.amplifyapp.com/checkin.html?bookingId=${bookingId}&status=error`;
          }

        } else {
          // ✅ Admin login fallback
          console.log("➡️ Regular login: redirecting to admin dashboard");
          window.location.href = "/admin-frontend/admin_dashboard.html";
        }

      } catch (err) {
        console.error("❌ Authentication or check-in failed:", err);
        alert("❌ Login failed. Redirecting to home.");
        window.location.href = "https://master.d3lmxb04veurt7.amplifyapp.com/index.html";
      }
    });
  </script>

</body>

</html>
