<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 80px;
      }
    </style>
  </head>
  <body>
    <p>🔄 Logging you in... Please wait.</p>

    <script>
      // Wait 2 seconds to give Amplify time to handle the OAuth code
      setTimeout(() => {
        const hasCode = window.location.search.includes("code=");
        if (hasCode) {
          // Let Amplify process it first, do not redirect yet
          console.log("✅ OAuth code found, waiting...");
        } else {
          console.log("✅ Code processed, redirecting to dashboard...");
          window.location.href = "admin_dashboard.html?from=cognito";
        }
      }, 2000);
    </script>
  </body>
</html>
