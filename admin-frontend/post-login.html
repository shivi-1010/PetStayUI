<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script src="https://unpkg.com/aws-amplify@4.3.26/dist/aws-amplify.min.js"></script>
    <script src="auth-check.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding-top: 80px;
      }
    </style>
  </head>
  <body>
    <p>🔐 Logging you in... Please wait.</p>

    <script>
      function waitForCodeToClearAndRedirect() {
        const hasCode = window.location.search.includes("code=");
        if (!hasCode) {
          console.log("✅ OAuth code cleared, redirecting to dashboard...");
          window.location.href = "admin_dashboard.html?from=cognito";
        } else {
          console.log("⏳ Waiting for Amplify to process code...");
          setTimeout(waitForCodeToClearAndRedirect, 500);
        }
      }

      waitForCodeToClearAndRedirect();
    </script>
  </body>
</html>
