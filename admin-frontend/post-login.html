<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>

<body>
  <h2>🔐 Logging you in... Please wait.</h2>

  <script>
    window.addEventListener('load', async () => {
      const Amplify = window.aws_amplify?.default;
      const Auth = window.aws_amplify?.Auth;

      if (!Amplify || !Auth) {
        console.error("Amplify not available.");
        document.body.innerHTML = "<p style='color:red'>❌ Error loading AWS Amplify.</p>";
        return;
      }

      // 🔧 Configure Amplify
      Amplify.configure({
        Auth: {
          region: 'us-east-1',
          userPoolId: 'us-east-1_I0PzIIZGM',
          userPoolWebClientId: '4jfnrkopa8cb7r30i0i25gar8k',
          oauth: {
            domain: 'us-east-1i0pziizgm.auth.us-east-1.amazoncognito.com',
            scope: ['email', 'openid', 'phone'],
            redirectSignIn: 'https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/post-login.html',
            redirectSignOut: 'https://master.d3lmxb04veurt7.amplifyapp.com/index.html',
            responseType: 'code'
          }
        }
      });

      try {
        console.log("🔐 Handling OAuth redirect...");

        const user = await Auth.currentAuthenticatedUser({ bypassCache: true });
        const session = await Auth.currentSession();
        const idToken = session.getIdToken();
        const token = idToken.getJwtToken();

        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get("bookingId");
        const fromLogin = urlParams.get("fromLogin");

        if (bookingId && fromLogin === "1") {
          console.log("🛎️ Detected QR login for booking:", bookingId);

          // ✅ Trigger check-in via Lambda API
          const res = await fetch(`https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/booking/${bookingId}/checkin`, {
            method: "POST",
           headers: { Authorization: `Bearer ${token}` }
          });

          const result = await res.json();

          if (res.ok) {
            console.log("✅ Check-in successful:", result);
            window.location.href = `/checkin.html?bookingId=${bookingId}&status=checkedin`;
          } else {
            console.error("❌ Check-in failed:", result.message);
            alert("❌ Check-in failed: " + result.message);
            window.location.href = `/checkin.html?bookingId=${bookingId}&status=error`;
          }

        } else {
          console.log("➡️ Regular login: redirecting to admin dashboard");
          window.location.href = "/admin-frontend/admin_dashboard.html";
        }

      } catch (err) {
        console.error("❌ Authentication or check-in failed:", err);
        alert("❌ Login failed. Redirecting to home.");
        window.location.href = "https://master.d3lmxb04veurt7.amplifyapp.com/index.html";
      }
    });
  </script>
</body>

</html>
