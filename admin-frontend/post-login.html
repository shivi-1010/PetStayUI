<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <style>body{font-family:Arial,sans-serif;text-align:center;margin-top:100px}</style>
</head>
<body>
  <h2>Logging you in… Please wait.</h2>

  <script>
    window.addEventListener('load', async () => {
      const { Amplify, Auth, Hub } = window.aws_amplify || {};
      if (!Amplify || !Auth) {
        console.error("Amplify not available.");
        document.body.innerHTML = "<p style='color:red'>Error loading AWS Amplify.</p>";
        return;
      }

      Amplify.configure({
        Auth: {
          region: window.PETSTAY_CONFIG.AWS_REGION,
          userPoolId: window.PETSTAY_CONFIG.COGNITO_USER_POOL_ID,
          userPoolWebClientId: window.PETSTAY_CONFIG.COGNITO_USER_POOL_CLIENT_ID,
          oauth: {
            domain: window.PETSTAY_CONFIG.COGNITO_DOMAIN,
            scope: ['email','openid','phone'],
            redirectSignIn: window.PETSTAY_CONFIG.REDIRECT_SIGN_IN_URL,   // MUST be this page’s URL
            redirectSignOut: window.PETSTAY_CONFIG.REDIRECT_SIGN_OUT_URL,
            responseType: 'code'
          }
        }
      });

      const qp = new URLSearchParams(location.search);
      const bookingId  = sessionStorage.getItem("bookingId") || qp.get("bookingId") || "";
      const fromLogin  = sessionStorage.getItem("fromLogin") || qp.get("fromLogin") || "";
      const adminLogin = sessionStorage.getItem("adminLogin") || "";
      const go = (u) => location.replace(u);

      // Give Amplify a moment to complete the code→token exchange
      await new Promise(r => setTimeout(r, 150));

      try {
        await Auth.currentAuthenticatedUser({ bypassCache: true });

        let session;
        for (let i = 0; i < 6; i++) {
          try { session = await Auth.currentSession(); if (session) break; }
          catch { await new Promise(r => setTimeout(r, 300)); }
        }
        if (!session) throw new Error("No session after login.");

        const idToken = session.getIdToken();
        const email = (idToken.payload.email || idToken.payload["cognito:username"] || "unknown").toLowerCase();

        const allowedStaff =
          (window.PETSTAY_CONFIG.ALLOWED_STAFF_EMAILS && window.PETSTAY_CONFIG.ALLOWED_STAFF_EMAILS.length
            ? window.PETSTAY_CONFIG.ALLOWED_STAFF_EMAILS
            : ["petstayteam@outlook.com","petstayteam@gmail.com"])
          .map(e => e.trim().toLowerCase());

        if (!allowedStaff.includes(email)) {
          alert(`You (${email}) are not authorized to check in guests.`);
          sessionStorage.clear();
          go(window.PETSTAY_CONFIG.REDIRECT_SIGN_OUT_URL);
          return;
        }

        if (fromLogin === "1" && bookingId) {
          sessionStorage.removeItem("fromLogin");
          sessionStorage.removeItem("bookingId");
          go(`/checkin.html?bookingId=${encodeURIComponent(bookingId)}&fromLogin=1`);
        } else if (adminLogin === "1") {
          sessionStorage.removeItem("adminLogin");
          go("/admin-frontend/admin_dashboard.html");
        } else {
          go("/");
        }
      } catch (err) {
        console.error("Authentication or redirect failed:", err);
        alert("Login failed. Redirecting to home.");
        go(window.PETSTAY_CONFIG.REDIRECT_SIGN_OUT_URL);
      }
    });
  </script>
</body>
</html>
