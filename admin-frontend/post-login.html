<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="https://cdn.jsdelivr.net/npm/aws-amplify@latest/dist/aws-amplify.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>

<body>
  <h2>🔐 Logging you in... Please wait.</h2>

  <script>
    window.addEventListener('load', async () => {
      const { Amplify, Auth } = window.aws_amplify;
      if (!Amplify || !Auth) {
        console.error("Amplify not available.");
        document.body.innerHTML = "<p style='color:red'>❌ Error loading AWS Amplify.</p>";
        return;
      }

      Amplify.configure({
        Auth: {
          region: 'us-east-1',
          userPoolId: 'us-east-1_I0PzIIZGM',
          userPoolWebClientId: '4jfnrkopa8cb7r30i0i25gar8k',
          oauth: {
            domain: 'us-east-1i0pziizgm.auth.us-east-1.amazoncognito.com',
            scope: ['email', 'openid', 'phone'],
            redirectSignIn: 'https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/post-login.html',
            redirectSignOut: 'https://master.d3lmxb04veurt7.amplifyapp.com/index.html',
            responseType: 'code'
          }
        }
      });

      try {
        console.log("🔐 Handling OAuth redirect...");

        const user = await Auth.currentAuthenticatedUser({ bypassCache: true });

        let session;
        for (let i = 0; i < 5; i++) {
          try {
            session = await Auth.currentSession();
            break;
          } catch {
            console.warn(`⏳ Waiting for Cognito session (attempt ${i + 1})...`);
            await new Promise(r => setTimeout(r, 1000));
          }
        }

        if (!session) {
          alert("❌ Session could not be established. Please refresh and try again.");
          return;
        }

        const idToken = session.getIdToken();
        const email = (idToken.payload.email || idToken.payload["cognito:username"] || "unknown").toLowerCase();

        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get("bookingId") || sessionStorage.getItem("bookingId");
        const fromLogin = urlParams.get("fromLogin") || sessionStorage.getItem("fromLogin");

        sessionStorage.removeItem("fromLogin");
        sessionStorage.removeItem("bookingId");

        const allowedStaff = ["petstayteam@outlook.com", "petstayteam@gmail.com"];
        const normalizedAllowed = allowedStaff.map(e => e.trim().toLowerCase());

        if (!normalizedAllowed.includes(email)) {
          alert(`❌ You (${email}) are not authorized to check in guests.`);
          const redirect = bookingId
            ? `https://master.d3lmxb04veurt7.amplifyapp.com/checkin.html?bookingId=${bookingId}&status=unauthorized`
            : `https://master.d3lmxb04veurt7.amplifyapp.com/index.html`;
          window.location.href = redirect;
          return;
        }


        // ✅ Redirect to checkin.html to perform the check-in
        if (bookingId && fromLogin === "1") {
          console.log("🛎️ QR login detected, redirecting to checkin.html for booking:", bookingId);
          window.location.href = `https://master.d3lmxb04veurt7.amplifyapp.com/checkin.html?bookingId=${bookingId}&fromLogin=1`;
        } else {
          console.log("➡️ Regular login: redirecting to admin dashboard");
          window.location.href = "/admin-frontend/admin_dashboard.html";
        }
      } catch (err) {
        console.error("❌ Authentication or redirect failed:", err);
        alert("❌ Login failed. Redirecting to home.");
        window.location.href = "https://master.d3lmxb04veurt7.amplifyapp.com/index.html";
      }
    });
  </script>

</body>

</html>
