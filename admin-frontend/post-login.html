<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
  </style>
</head>
<body>
  <p>🔐 Logging you in... Please wait.</p>

  <!-- ✅ Use unpkg CDN -->
  <script src="https://unpkg.com/aws-amplify@4.3.26/dist/aws-amplify.min.js"></script>

  <script>
    window.addEventListener("load", async () => {
      const waitForAmplify = () =>
        new Promise((resolve, reject) => {
          const interval = setInterval(() => {
            if (window.Amplify && window.Amplify.Auth) {
              clearInterval(interval);
              resolve(window.Amplify);
            }
          }, 100);
          setTimeout(() => {
            clearInterval(interval);
            reject(new Error("Amplify script failed to load."));
          }, 5000);
        });

      try {
        const Amplify = await waitForAmplify();

        Amplify.configure({
          Auth: {
            region: 'us-east-1',
            userPoolId: 'us-east-1_I0PzIIZGM',
            userPoolWebClientId: '4jfnrkopa8cb7r30i0i25gar8k',
            oauth: {
              domain: 'us-east-1i0pziizgm.auth.us-east-1.amazoncognito.com',
              scope: ['email', 'openid', 'phone'],
              redirectSignIn: 'https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/post-login.html',
              redirectSignOut: 'https://master.d3lmxb04veurt7.amplifyapp.com/index.html',
              responseType: 'code',
            },
          }
        });

        if (window.location.search.includes("code=")) {
          console.log("🔁 Found OAuth code, completing sign-in...");
          await Amplify.Auth.federatedSignIn();
        }

        console.log("✅ Auth complete, redirecting...");
        window.location.href = 'admin_dashboard.html?from=cognito';
      } catch (error) {
        console.error("❌ Final sign-in error:", error);
      }
    });
  </script>
</body>
</html>
