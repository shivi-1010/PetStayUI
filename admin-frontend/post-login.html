<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script src="/admin-frontend/aws-amplify.min.js"></script>
  <script>
    window.addEventListener('load', async () => {
      const Amplify = window.aws_amplify?.default;
      const Auth = window.aws_amplify?.Auth;

      if (!Amplify || !Auth) {
        console.error("Amplify not available.");
        return;
      }

      Amplify.configure({
        Auth: {
          region: 'us-east-1',
          userPoolId: 'us-east-1_I0PzIIZGM',
          userPoolWebClientId: '4jfnrkopa8cb7r30i0i25gar8k',
          oauth: {
            domain: 'us-east-1i0pziizgm.auth.us-east-1.amazoncognito.com',
            scope: ['email', 'openid', 'phone'],
            redirectSignIn: 'https://master.d3lmxb04veurt7.amplifyapp.com/admin-frontend/post-login.html',
            redirectSignOut: 'https://master.d3lmxb04veurt7.amplifyapp.com/index.html',
            responseType: 'code'
          }
        }
      });

      try {
        console.log("🔐 Handling OAuth redirect...");
        await Auth.currentAuthenticatedUser();
        console.log("✅ Authenticated. Checking redirect target...");

        const urlParams = new URLSearchParams(window.location.search);
        const bookingId = urlParams.get("bookingId");
        const fromLogin = urlParams.get("fromLogin");

        if (bookingId && fromLogin === "1") {
          // Redirect to check-in with preserved context
          const redirectTo = `/checkin.html?bookingId=${bookingId}&fromLogin=1`;
          console.log("➡️ Redirecting to:", redirectTo);
          window.location.href = redirectTo;
        } else {
          console.log("➡️ Redirecting to admin dashboard...");
          window.location.href = "admin_dashboard.html";
        }

      } catch (err) {
        console.error("❌ Authentication failed or user not logged in:", err);
        // Optional: fallback redirect
        window.location.href = "https://master.d3lmxb04veurt7.amplifyapp.com/index.html";
      }
    });
  </script>
</head>

<body>
  <p>🔐 Logging you in... Please wait.</p>
</body>
</html>
