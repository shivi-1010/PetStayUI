<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Booking | PetStay</title>
  <link rel="stylesheet" href="../assets/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>

<body>

  <div class="booking-wrapper">
    <main class="main-wrapper">
      <section class="tab-components">
        <div class="container">
          <div class="title-wrapper text-center pt-4">
            <h2>Book Your Pet With Us !</h2>
            <p>A new pet stay reservation</p>
          </div>

          <div class="form-elements-wrapper mt-4">
            <div class="card-style">
              <form id="bookingForm">

                <!-- Owner Information -->

                <div class="row g-3">
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Owner Name</label>
                      <input type="text" name="ownerName" placeholder="Owner Name" required />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Email Address</label>
                      <input type="email" name="email" placeholder="owner@example.com" required />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Phone Number</label>
                      <input type="tel" name="PhoneNumber" placeholder="+1 234 567 8900" required />

                    </div>
                  </div>
                </div>

                <!-- Pet Information -->
                <h5 class="mt-4 mb-3">🐶 Pet Information</h5>
                <div class="row g-3">
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Pet Name</label>
                      <input type="text" name="petName" placeholder="Pet Name" required />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="select-style-1">
                      <label>Pet Species</label>
                      <div class="select-position">
                        <select name="petSpecies" required>
                          <option value="">Select Species</option>
                          <option>Dog</option>
                          <option>Cat</option>
                        </select>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Pet Breed</label>
                      <input type="text" name="petBreed" placeholder="Pet Breed" />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Pet Age (in years)</label>
                      <input type="number" name="petAge" placeholder="e.g., 2" min="0" step="0.1" required />
                    </div>
                  </div>

                </div>

                <!-- Booking Details -->
                <h5 class="mt-4 mb-3">📅 Booking Details</h5>
                <div class="row g-3">
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Check-In Date</label>
                      <input type="date" name="checkInDate" required />
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="input-style-1">
                      <label>Check-Out Date</label>
                      <input type="date" name="checkOutDate" required />
                    </div>
                  </div>
             <div class="col-md-4">
  <div class="select-style-1">
    <label>Time of Arrival</label>
    <div class="select-position">
      <select name="arrivalTime" required>
        <option value="">Select Time</option>
        <option value="10:00">10:00 AM</option>
        <option value="10:15">10:15 AM</option>
        <option value="10:30">10:30 AM</option>
        <option value="10:45">10:45 AM</option>
        <option value="11:00">11:00 AM</option>
        <option value="11:15">11:15 AM</option>
        <option value="11:30">11:30 AM</option>
        <option value="11:45">11:45 AM</option>
        <option value="12:00">12:00 PM</option>
        <option value="12:15">12:15 PM</option>
        <option value="12:30">12:30 PM</option>
        <option value="12:45">12:45 PM</option>
        <option value="13:00">1:00 PM</option>
        <option value="13:15">1:15 PM</option>
        <option value="13:30">1:30 PM</option>
        <option value="13:45">1:45 PM</option>
        <option value="14:00">2:00 PM</option>
        <option value="14:15">2:15 PM</option>
        <option value="14:30">2:30 PM</option>
        <option value="14:45">2:45 PM</option>
        <option value="15:00">3:00 PM</option>
        <option value="15:15">3:15 PM</option>
        <option value="15:30">3:30 PM</option>
        <option value="15:45">3:45 PM</option>
        <option value="16:00">4:00 PM</option>
        <option value="16:15">4:15 PM</option>
        <option value="16:30">4:30 PM</option>
        <option value="16:45">4:45 PM</option>
        <option value="17:00">5:00 PM</option>
        <option value="17:15">5:15 PM</option>
        <option value="17:30">5:30 PM</option>
        <option value="17:45">5:45 PM</option>
        <option value="18:00">6:00 PM</option>
      </select>
    </div>
  </div>
</div>

                </div>

                <!-- Submit Button -->
                <div class="text-center mt-4">
                  <button type="submit" class="main-btn primary-btn btn-hover">Book Now</button>
                </div>

              </form>
            </div>
          </div>

        </div>

    </main>
  </div>


<!--  Spinner Overlay -->
<div id="loadingOverlay" style="
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255, 255, 255, 0.8);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
">
  <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-3 fw-semibold">Processing your booking...</p>
</div>

 <!-- JS -->
  <script src="../assets/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>

<!-- AWS SDK -->
<script type="module">
  import {
    CognitoIdentityClient,
    GetIdCommand,
    GetCredentialsForIdentityCommand,
  } from "https://cdn.jsdelivr.net/npm/@aws-sdk/client-cognito-identity/dist/index.min.js";
  import {
    SFNClient,
    DescribeExecutionCommand
  } from "https://cdn.jsdelivr.net/npm/@aws-sdk/client-sfn/dist/index.min.js";

  document.addEventListener("DOMContentLoaded", () => {
    const REGION = "us-east-1";
    const IDENTITY_POOL_ID = "us-east-1:c7a2fc1a-defe-44f2-a081-15894b4ff215";

    const form = document.getElementById("bookingForm");
    const overlay = document.getElementById("loadingOverlay");

    const showLoading = () => {
      overlay.style.display = "flex";
      form.querySelector("button[type='submit']").disabled = true;
    };

    const hideLoading = () => {
      overlay.style.display = "none";
      form.querySelector("button[type='submit']").disabled = false;
    };

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      showLoading();

      const formData = new FormData(this);
      const data = {
        OwnerName: formData.get("ownerName"),
        Email: formData.get("email"),
        PhoneNumber: formData.get("PhoneNumber"),
        PetName: formData.get("petName"),
        PetSpecies: formData.get("petSpecies"),
        PetBreed: formData.get("petBreed"),
        PetAge: formData.get("petAge"),
        CheckInDate: formData.get("checkInDate"),
        CheckOutDate: formData.get("checkOutDate"),
        ArrivalTime: formData.get("arrivalTime")
      };

      try {
        const response = await fetch(
          "https://howm2f0jc9.execute-api.us-east-1.amazonaws.com/newbooking",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          }
        );

        const result = await response.json();

        if (!response.ok || !result.executionArn) {
          hideLoading();
          alert("Booking failed: " + (result.message || "Unknown error"));
          return;
        }

        const executionArn = result.executionArn;

        const identityClient = new CognitoIdentityClient({ region: REGION });
        const identityId = await identityClient.send(
          new GetIdCommand({ IdentityPoolId: IDENTITY_POOL_ID })
        );
        const creds = await identityClient.send(
          new GetCredentialsForIdentityCommand({ IdentityId: identityId.IdentityId })
        );

        const sfn = new SFNClient({
          region: REGION,
          credentials: {
            accessKeyId: creds.Credentials.AccessKeyId,
            secretAccessKey: creds.Credentials.SecretKey,
            sessionToken: creds.Credentials.SessionToken
          }
        });

        let tries = 0;
        const maxTries = 30; // ~60 seconds max

        async function poll() {
          tries++;
          const desc = await sfn.send(new DescribeExecutionCommand({ executionArn }));

          if (desc.status === "SUCCEEDED") {
            const output = JSON.parse(desc.output);

            sessionStorage.setItem("BookingID", output.BookingID);
            sessionStorage.setItem("qrCodeBase64", output.qrCode || "");
            sessionStorage.setItem("OwnerName", data.OwnerName);

            window.location.href = `booking-success.html?bookingId=${output.BookingID}`;
          } else if (desc.status === "FAILED" || desc.status === "TIMED_OUT") {
            hideLoading();
            alert("Booking failed: A workflow error occurred.");
          } else if (tries >= maxTries) {
            hideLoading();
            alert("Booking is taking too long. Please check your email or try again.");
          } else {
            setTimeout(poll, 2000);
          }
        }

        poll();

      } catch (err) {
        hideLoading();
        console.error(err);
        alert("Error: " + err.message);
      }
    });
  });
</script>



</body>

</html>
