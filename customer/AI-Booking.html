<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PetStay — Book via Chat</title>
  <meta name="color-scheme" content="dark light" />

  <!-- AWS SDK (Lex V2 client) -->
  <script src="https://sdk.amazonaws.com/js/aws-sdk-2.1488.0.min.js"></script>

  <!-- Your global config -->
  <script src="/assets/js/config.js"></script>

  <style>
    /* Reset & full screen */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
    }

    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      background: #f8f8f8;
    }

    .msg {
      padding: 0.6rem 0.9rem;
      margin: 0.3rem 0;
      border-radius: 12px;
      max-width: 75%;
      word-wrap: break-word;
    }
    .msg.user {
      background: #007aff;
      color: white;
      align-self: flex-end;
    }
    .msg.bot {
      background: #e5e5ea;
      color: black;
      align-self: flex-start;
    }

    .inputbar {
      display: flex;
      border-top: 1px solid #ccc;
    }
    .inputbar input {
      flex: 1;
      border: none;
      padding: 0.8rem;
      font-size: 1rem;
      outline: none;
    }
    .inputbar button {
      border: none;
      background: #007aff;
      color: white;
      padding: 0 1.2rem;
      font-size: 1rem;
      cursor: pointer;
    }
    .inputbar button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <!-- Chat log -->
  <div id="chat-log" aria-live="polite" aria-label="Chat transcript"></div>

  <!-- Input bar -->
  <div class="inputbar">
    <input id="chat-text" type="text" placeholder="Type your reply…" autocomplete="off" />
    <button id="chat-send" class="btn">Send</button>
  </div>

  <!-- Hidden file input for photo uploads -->
  <input id="chat-photo" type="file" accept="image/jpeg,image/png" style="display:none" />

  <!-- Lex client logic -->
  <script src="/assets/js/ai-booking-lex.js"></script>
</body>
</html>
