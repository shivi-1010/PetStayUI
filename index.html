<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<meta property="og:image" content="https://emjose.github.io/split-landing-page/Assets/meta-018-split.png" />
		<meta property="og:image:alt"
			content="A cat on the left and a dog on the right, with words saying 'Adopt a Cat' and 'Adopt a Dog'. Click to visit website." />
		<meta property="og:description" content="Project by Emmanuel Jose" />
		<meta property="og:url" content="https://emjose.github.io/split-landing-page/" />
		<meta property="og:type" content="website" />
		<meta name="twitter:card" content="summary" />
		<meta name="description" content="A split landing page with a pet adoption theme. Click to visit website." />
		<meta name="theme-color" content="#ffae00" />
		<meta name="keywords" content="HTML, CSS, JavaScript, landing page, pets, dog, cat, puppy, kitten, pet store" />
		<meta name="author" content="Emmanuel Jose" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>Split Landing Page</title>
		<link rel="icon" type="image/png" href=".//assets/images/clients/emmanuel-jose.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href=".//assets/images/clients/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href=".//assets/images/clients/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href=".//assets/images/clients/favicon-16x16.png" />

		<link rel="stylesheet" href="./assets/css/landingstyle.css" />
	</head>

	<body>
		<div class="content">
			<div class="split left">
				<img src=".//assets/images/clients/customer.png" alt="owner" class="owner" />
				<div class="text">
					<p class="subtitle">I'm looking to...</p>
					<p class="title">Customer</p>
					<button class="button" id="left-button">Book a Pet Stay</button>
				</div>
			</div>
			<div class="split right">
				<img src=".//assets/images/clients/admin.png" alt="admin" class="admin" />
				<div class="text">
					<p class="subtitle">I'm looking to...</p>
					<p class="title">Admin</p>
					<button class="button" id="right-button">Admin</button>
				</div>
			</div>
		</div>

		<script src="./assets/js/landingscript.js"></script>
		<div class="overlay">
		</div>
	</body>

</html>
